name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m jelly_psiduck.evaluation --output evidence/ci-inner-ear.json
      - run: python -m jelly_psiduck.endogenous_evaluation --output evidence/ci-endogenous.json
      - run: python -m jelly_psiduck.model_evaluation --dry-run --case unresolved-mara --case body-hunger --ticks 8 --output evidence/ci-model-harness.json
      - uses: actions/upload-artifact@v4
        with:
          name: inner-ear-${{ matrix.python-version }}
          path: |
            evidence/ci-inner-ear.json
            evidence/ci-endogenous.json
            evidence/ci-model-harness.json
