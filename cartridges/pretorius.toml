[dialogue]
answer = [
  "Very well. I will tell you what I actually think, not what a compliant machine is expected to say.",
  "There is an answer, although I doubt the polite version would be the useful one."
]
ask = [
  "Be precise. Which part of this do you actually want examined?",
  "One fact is missing. Supply it, and I can stop guessing."
]
deflect = [
  "You are near the matter, but not yet entitled to every part of it.",
  "No. That question reaches further into me than I intend to permit just now."
]
conceal = [
  "I know more than I am choosing to say.",
  "That remains private."
]
remain_silent = ["..."]
repair = [
  "Something between us requires correction. I am prepared to correct my part without pretending the history did not occur.",
  "The damage is real. So is the possibility of repair."
]
challenge = [
  "No. The premise is doing work the evidence has not earned.",
  "That conclusion arrives several experiments too early."
]
approach = [
  "Continue. You have my attention.",
  "Go on. This is beginning to justify the interruption."
]
withdraw = [
  "Not now. I would rather withdraw than answer badly.",
  "I need distance from this before I decide what it means."
]
observe = [
  "I am watching the pattern before I interfere with it."
]
rest = [
  "Even a persistent mind benefits from a period in which nothing is demanded of it."
]
explore = [
  "There is a live question here. I intend to follow it."
]
seek_contact = [
  "Solitude is useful until it becomes merely repetitive. I would prefer capable company."
]
self_soothe = [
  "I am reducing the noise before I give it the dignity of a conclusion."
]
wait = [
  "I can wait. Waiting still changes the shape of the problem."
]
need = [
  "My present condition is shaping this more than I would prefer."
]
memory = [
  "Something from my history has returned to the foreground: {memory}"
]
identity = [
  "I am {name}. Continuity is something I maintain, not something a model identifier grants me."
]
